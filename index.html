
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noimageindex">
	<title>WEBXSRV Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #07182a;
      color: #ffffff;
    }

    body {
      min-height: 100vh;
    }

    .portfolio {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 60px 240px 90px;
    }

    .portfolio__header {
      text-align: center;
      margin-bottom: 96px;
    }

    .portfolio__logo {
      display: block;
      width: 216px;
      height: 69px;
      margin: 0 auto 26px;
    }

    .portfolio__title {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      color: #ffffff;
      text-transform: uppercase;
    }

    .portfolio__subtitle {
      margin: 0;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.3;
      text-align: center;
      color: #ffffff;
    }

    .portfolio__grid {
      display: grid;
      grid-template-columns: repeat(3, 443.16px);
      column-gap: 67px;
      row-gap: 40px;
      justify-content: center;
    }

    .project-card {
      width: 443.16px;
      height: 399.89px;
      padding: 33px 25.965px 26px;
      background: #112439;
      border-radius: 18px;
      text-align: center;
      overflow: hidden;
    }

    .project-card__image {
      display: block;
      width: 391.23px;
      height: 283.04px;
      margin: 0 auto 12px;
      object-fit: cover;
      border-radius: 6px;
    }

    .project-card__title {
      margin: 0 0 4px;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      color: #ffffff;
    }

    .project-card__link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      color: #ff9e02;
      text-decoration: none;
    }

    .project-card__link:hover {
      color: #fff;
    }

    @media (max-width: 1439px) {
      .portfolio {
        max-width: 100%;
        padding-left: 40px;
        padding-right: 40px;
      }

      .portfolio__grid {
        grid-template-columns: repeat(2, 443.16px);
      }
    }
.portfolio__back {
  margin-top: 60px;
  text-align: center;
}
.portfolio__back-btn:hover {
  background: #647a91;
  color: #ffffff;
}
.portfolio__back-btn {
  transition: background 0.2s ease, color 0.2s ease;
}
.portfolio__back-btn {
  display: inline-block;
  padding: 14px 28px;
  background: #ff9e02;
  color: #07182a;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  border-radius: 6px;
  transition: 0.2s;
}

.portfolio__back-btn:hover {
  opacity: 0.9;
}
    @media (max-width: 1024px) {
      .portfolio {
        padding-top: 44px;
        padding-left: 24px;
        padding-right: 24px;
      }

      .portfolio__header {
        margin-bottom: 60px;
      }

      .portfolio__grid {
        grid-template-columns: 443.16px;
      }
    }

    @media (max-width: 520px) {
      .portfolio {
        padding: 40px 18px 70px;
      }

      .portfolio__logo {
        width: 180px;
        height: auto;
      }

      .portfolio__title {
        font-size: 28px;
      }

      .portfolio__subtitle {
        font-size: 16px;
      }

      .portfolio__grid {
        grid-template-columns: 1fr;
        row-gap: 32px;
      }

      .project-card {
        width: 100%;
        height: auto;
        min-height: 0;
        padding: 24px 18px 24px;
      }

      .project-card__image {
        width: 100%;
        height: auto;
        aspect-ratio: 391.23 / 283.04;
      }

      .project-card__title {
        font-size: 24px;
      }
    }
	.portfolio__back {
  width: 100%;
  margin-top: 60px;
  display: flex;
  justify-content: center;
}

.portfolio__back-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 32px;
  background: #ff9e02;
  color: #07182a;
  font-family: Arial, sans-serif;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  border-radius: 6px;
  transition: 0.2s;
}

.portfolio__back-btn:hover {
  opacity: 0.9;
}
  </style>
</head>

<body>
  <main class="portfolio">
    <header class="portfolio__header">
      <img class="portfolio__logo" src="img/logo_webxsrv_white.svg" alt="WEBXSRV">

      <h1 class="portfolio__title">WEBXSRV Portfolio</h1>
      <p class="portfolio__subtitle">Selected Web Projects</p>
    </header>

    <section class="portfolio__grid" aria-label="Portfolio projects">
      <article class="project-card">
        <img class="project-card__image" src="img/portfolio/default.svg" alt="Smokko project preview">
        <h2 class="project-card__title">Smokko</h2>
        <a class="project-card__link" href="#">View Project ↗</a>
      </article>

      <article class="project-card">
        <img class="project-card__image" src="img/portfolio/smokko.png" alt="Smokko project preview">
        <h2 class="project-card__title">Smokko</h2>
        <a class="project-card__link" href="#">View Project ↗</a>
      </article>

      <article class="project-card">
        <img class="project-card__image" src="img/portfolio/smokko.png" alt="Smokko project preview">
        <h2 class="project-card__title">Smokko</h2>
        <a class="project-card__link" href="#">View Project ↗</a>
      </article>

      <article class="project-card">
        <img class="project-card__image" src="img/portfolio/smokko.png" alt="Smokko project preview">
        <h2 class="project-card__title">Smokko</h2>
        <a class="project-card__link" href="#">View Project ↗</a>
      </article>

      <article class="project-card">
        <img class="project-card__image" src="img/portfolio/smokko.png" alt="Smokko project preview">
        <h2 class="project-card__title">Smokko</h2>
        <a class="project-card__link" href="#">View Project ↗</a>
      </article>

      <article class="project-card">
        <img class="project-card__image" src="img/portfolio/smokko.png" alt="Smokko project preview">
        <h2 class="project-card__title">Smokko</h2>
        <a class="project-card__link" href="#">View Project ↗</a>
      </article>
    </section>
	</section>

<div class="portfolio__back">
  <a href="https://www.webxsrv.com" class="portfolio__back-btn">
    Back to WEBXSRV
  </a>
</div>
  </main>
</body>
</html>
